# The existing schema is provided below for context.
# Your task is to propose the GraphQL mutation required to implement the portfolio renaming.

type Query {
  portfolio(portfolioId: ID!): Portfolio
}

type Portfolio {
  id: ID!
  cashAccount: CashAccount
  postOnboardingInfo: PostOnboardingInfo!
  securitiesAccountNumber: String
  custodianBankBIC: String
  personalizations: ProductPersonalization
}

type CashAccount {
  iban: String
  bic: String
}

type PostOnboardingInfo {
  id: ID!
  allStepsCompleted: Boolean!
}

type ProductPersonalization {
  id: ID!
  name: String!
}

type Mutation {
  updatePortfolioPersonalization(
    input: UpdatePortfolioPersonalizationInput!
  ): UpdatePortfolioPersonalizationPayload
}

input UpdatePortfolioPersonalizationInput {
  portfolioId: ID!
  name: String!
}

type UpdatePortfolioPersonalizationPayload {
  portfolio: Portfolio
  errors: [PortfolioPersonalizationError!]!
}

type PortfolioPersonalizationError {
  field: PortfolioPersonalizationErrorField!
  message: String!
}

enum PortfolioPersonalizationErrorField {
  PORTFOLIO_ID
  NAME
}